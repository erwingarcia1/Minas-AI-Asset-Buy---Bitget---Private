{% extends "base.html" %}
{% block title %}Log in — Auto-Buy Admin{% endblock %}
{% block content %}
<div class="card" style="max-width:26rem; margin:5rem auto; padding:2.4rem 2.2rem; text-align:center;">
  <div style="font-size:.68rem; text-transform:uppercase; letter-spacing:.18em; color:var(--muted); margin-bottom:.6rem;">Restricted access</div>
  <h2 style="margin-bottom:1.2rem;">Log in</h2>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post">
    <label style="text-align:left;">Password
      <input type="password" name="password" autofocus required>
    </label>
    <div class="actions" style="justify-content:center;"><button class="primary">Log in</button></div>
  </form>
</div>
{% endblock %}
