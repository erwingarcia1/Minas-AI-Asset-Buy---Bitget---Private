{% extends "base.html" %}
{% block title %}{{ title }} — Auto-Buy Admin{% endblock %}
{% block content %}
<div class="card" style="max-width:36rem; margin:0 auto;">
<h2>{{ title }}</h2>
<form method="post">
  <label>Name
    <input type="text" name="name" value="{{ client.name or client.get('name', '') }}" required>
  </label>
  <label>Email
    <input type="email" name="email" value="{{ client.email or client.get('email', '') }}" required>
  </label>
  <label>License # <small>(optional)</small>
    <input type="text" name="license_number" value="{{ client.license_number or client.get('license_number', '') }}">
  </label>
  <label>Exchange
    <select name="exchange">
      {% for ex in exchanges %}
      <option value="{{ ex }}" {% if (client.exchange or client.get('exchange')) == ex %}selected{% endif %}>{{ ex }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Sub account details
    <small>(the exact sub-account name on the exchange — used to match API keys)</small>
    <input type="text" name="subaccount" value="{{ client.subaccount or client.get('subaccount', '') }}" required>
  </label>
  <label>Crypto ticker for auto asset to purchase
    <small>One symbol (BTC) buys just that coin. Several, comma separated
      (XRP,XLM,ADA), splits every arriving deposit evenly between them — add
      <code>:weight</code> for uneven splits (XRP:3,XLM:2 = 60/40). Each leg
      must clear the exchange minimum (about 1 USDT), so a basket of N coins
      needs roughly N USDT per deposit.</small>
    <input type="text" name="ticker" value="{{ client.ticker or client.get('ticker', '') }}" required>
  </label>
  <label>Minimum USDT to trigger a buy
    <input type="number" name="min_usdt" step="0.01" min="0"
           value="{{ client.min_usdt or client.get('min_usdt', 5) }}">
  </label>
  <label style="display:flex; align-items:center; gap:.6rem; text-transform:none; letter-spacing:0; font-size:.92rem; color:var(--ink); font-weight:500;">
    <input type="checkbox" name="enabled" style="width:auto"
           {% if client.get('enabled', 1) in (1, '1', 'on', True) or client.enabled %}checked{% endif %}>
    Enabled (include in the bot when applied)
  </label>
  <label>Notes <small>(optional)</small>
    <textarea name="notes" rows="3">{{ client.notes or client.get('notes', '') }}</textarea>
  </label>
  <div class="actions">
    <button class="primary" type="submit">Save</button>
    <a href="{{ url_for('index') }}">Cancel</a>
  </div>
</form>
</div>
{% endblock %}
