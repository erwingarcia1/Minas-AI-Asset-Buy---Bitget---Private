name: API tests

on:
  push:
    branches: ["*"]
    paths: ["api/**", "tests/**", "alembic/**", "templates/**", "requirements.txt", ".github/workflows/api-tests.yml"]
  pull_request:
    paths: ["api/**", "tests/**", "alembic/**", "templates/**", "requirements.txt"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autobuy
          POSTGRES_PASSWORD: autobuy_password
          POSTGRES_DB: autobuy_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autobuy" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrations apply on an empty database
        run: alembic upgrade head   # against the service's autobuy_db; the suite migrates its own autobuy_test
      - name: Run the full test suite with coverage gate
        # tests/conftest.py owns DATABASE_URL/REDIS_URL: autobuy_test + Redis db 1, never .env.
        run: pytest tests -q --cov=api --cov-fail-under=85
        env:
          PYTHONPATH: .
          TEST_DATABASE_URL: postgresql+asyncpg://autobuy:autobuy_password@localhost:5432/autobuy_test
          TEST_REDIS_URL: redis://localhost:6379/1
