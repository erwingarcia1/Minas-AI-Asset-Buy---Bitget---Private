name: Frontend tests

on:
  push:
    branches: ["*"]
    paths: ["frontend/**", ".github/workflows/frontend-tests.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-tests.yml"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build the production bundle
        run: npm run build
      - name: Unit tests (vitest, jsdom)
        run: npm test
