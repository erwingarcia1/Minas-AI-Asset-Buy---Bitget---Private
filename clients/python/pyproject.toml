[tool.poetry]
name = "autobuy-client"
version = "0.4.1"
description = "Type-safe Python client for the AutoBuy Crypto API (generated from OpenAPI)"
authors = ["AutoBuy support <support@minastech.ca>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "autobuy_client" }]
keywords = ["autobuy", "crypto", "api-client", "openapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[tool.poetry.dependencies]
python = "^3.9"
httpx = ">=0.24,<1.0"
typing-extensions = { version = ">=4.4", python = "<3.11" }

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.21"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
