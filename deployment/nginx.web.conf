# nginx config for the `web` service in docker-compose.yml: serves the built
# SPA (frontend/dist, bind-mounted read-only) and forwards /api/ + /health to
# the API container on the compose network. TLS is NOT terminated here — the
# service is published on 127.0.0.1:8080 only and fronted by the `caddy`
# service (public HTTPS) and `tailscale serve` (tailnet), which own HTTPS.
#
# Routing plus browser-hardening headers for the SPA; update the CSP here when
# the SPA's third-party origins (Sumsub) change.

# Docker's embedded DNS; re-resolve so an `api` container restart with a new
# IP does not leave nginx pinned to the old one.
resolver 127.0.0.11 valid=10s ipv6=off;

# The only peers that can reach this nginx are the caddy container and the
# host's docker-proxy (tailscale serve -> 127.0.0.1:8080), both on private
# docker ranges, and both write X-Forwarded-For themselves. Take the visitor's
# address from there so $remote_addr — and the single X-Forwarded-For value
# passed to the API below — is the real client, which is what the API's per-IP
# rate limits key on.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    client_max_body_size 1m;

    # NOTE: nginx add_header is not inherited into a location that sets its own
    # add_header, so the two Cache-Control locations below repeat this block —
    # otherwise the SPA fallback (try_files -> /index.html) would drop the CSP.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.sumsub.com; frame-src https://api.sumsub.com https://in.sumsub.com; connect-src 'self' https://api.sumsub.com https://in.sumsub.com; img-src 'self' data: blob: https://static.sumsub.com; media-src blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(self \"https://api.sumsub.com\" \"https://in.sumsub.com\"), microphone=(self \"https://api.sumsub.com\" \"https://in.sumsub.com\")" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    set $api_upstream http://api:8000;

    # API and health check on the same origin (the app calls /api on its own
    # origin, VITE_API_BASE_URL=/api, so CORS is not involved).
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # overwrite, never append: the API trusts this header as-is
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 65s;
    }
    location = /health {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # Hashed build assets are immutable; index.html must always be revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.sumsub.com; frame-src https://api.sumsub.com https://in.sumsub.com; connect-src 'self' https://api.sumsub.com https://in.sumsub.com; img-src 'self' data: blob: https://static.sumsub.com; media-src blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(self \"https://api.sumsub.com\" \"https://in.sumsub.com\"), microphone=(self \"https://api.sumsub.com\" \"https://in.sumsub.com\")" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.sumsub.com; frame-src https://api.sumsub.com https://in.sumsub.com; connect-src 'self' https://api.sumsub.com https://in.sumsub.com; img-src 'self' data: blob: https://static.sumsub.com; media-src blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(self \"https://api.sumsub.com\" \"https://in.sumsub.com\"), microphone=(self \"https://api.sumsub.com\" \"https://in.sumsub.com\")" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
