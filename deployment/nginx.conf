# Reverse proxy for the AutoBuy API. TLS termination happens here; the app
# adds HSTS itself when API_ENV=production.
upstream autobuy_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Belt-and-braces limit in front of the app's own slowapi limits.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/ssl/certs/autobuy.crt;
    ssl_certificate_key /etc/ssl/private/autobuy.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types application/json text/plain;
    client_max_body_size 1m;

    location /metrics {
        # Prometheus only -- never expose publicly
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://autobuy_api;
    }

    location / {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://autobuy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
}

# --------------------------------------------------------------------------
# Web dashboard vhost (when the SPA is served here): the only third-party
# origins it needs are Sumsub's WebSDK. If you add a Content-Security-Policy,
# allow exactly these and nothing else:
#
#   add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.sumsub.com; frame-src https://api.sumsub.com https://in.sumsub.com; connect-src 'self' https://api.sumsub.com https://in.sumsub.com; img-src 'self' data: blob: https://static.sumsub.com; media-src blob:; style-src 'self' 'unsafe-inline'" always;
#   add_header Permissions-Policy "camera=(self \"https://api.sumsub.com\" \"https://in.sumsub.com\"), microphone=(self \"https://api.sumsub.com\" \"https://in.sumsub.com\")" always;
#
# Verified with @sumsub/websdk-react 2.9.0 on 2026-09-10: the SDK iframe is
# served from https://api.sumsub.com/websdk/websdk.html (in.sumsub.com is the
# alternate host in the bundle); the iframe pulls its own assets from
# static.sumsub.com. Uploads and liveness go to api.sumsub.com.
