# Reverse proxy for the AutoBuy API. TLS termination happens here; the app
# adds HSTS itself when API_ENV=production.
upstream autobuy_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Belt-and-braces limit in front of the app's own slowapi limits.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/ssl/certs/autobuy.crt;
    ssl_certificate_key /etc/ssl/private/autobuy.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types application/json text/plain;
    client_max_body_size 1m;

    location /metrics {
        # Prometheus only -- never expose publicly
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://autobuy_api;
    }

    location / {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://autobuy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
}

# --------------------------------------------------------------------------
# Web app vhost: serves the built SPA (frontend/dist) and forwards the API.
# Build on the server with  cd frontend && npm ci && npm run build  and point
# `root` at the resulting dist/ (or rsync dist/ to /var/www/autobuy).
# The SPA calls the API on the same origin under /api (VITE_API_BASE_URL=/api),
# so CORS is not involved; keep APP_BASE_URL equal to this vhost's origin.
server {
    listen 80;
    server_name app.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/ssl/certs/autobuy.crt;
    ssl_certificate_key /etc/ssl/private/autobuy.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/autobuy/frontend/dist;
    index index.html;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    client_max_body_size 1m;

    # The only third-party origins the SPA needs are Sumsub's WebSDK.
    # Verified with @sumsub/websdk-react 2.9.0 on 2026-09-10: the SDK iframe is
    # served from https://api.sumsub.com/websdk/websdk.html (in.sumsub.com is the
    # alternate host in the bundle); the iframe pulls its own assets from
    # static.sumsub.com. Uploads and liveness go to api.sumsub.com.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.sumsub.com; frame-src https://api.sumsub.com https://in.sumsub.com; connect-src 'self' https://api.sumsub.com https://in.sumsub.com; img-src 'self' data: blob: https://static.sumsub.com; media-src blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(self \"https://api.sumsub.com\" \"https://in.sumsub.com\"), microphone=(self \"https://api.sumsub.com\" \"https://in.sumsub.com\")" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API and health check on the same origin (the app's own HSTS/CORS headers pass through).
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://autobuy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
    location = /health {
        proxy_pass http://autobuy_api;
        proxy_set_header Host $host;
    }

    # Hashed build assets are immutable; index.html must always be revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
