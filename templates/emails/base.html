<!doctype html>
<html>
  <body style="margin:0;background:#f4f6f5;font-family:Arial,Helvetica,sans-serif;color:#1c2422;">
    <div style="max-width:560px;margin:0 auto;padding:24px;">
      <div style="background:#ffffff;border-radius:8px;padding:32px;">
        <h1 style="font-size:20px;margin:0 0 16px;">{% block title %}{% endblock %}</h1>
        {% block body %}{% endblock %}
        <p style="color:#5a6763;font-size:12px;margin-top:32px;">
          AutoBuy · Questions? Reply to this email or contact {{ support_email }}.
          {% if show_unsubscribe %}<br/><a href="{{ unsubscribe_url }}" style="color:#5a6763;">Unsubscribe from summaries</a>{% endif %}
        </p>
      </div>
    </div>
  </body>
</html>
