# AutoBuy platform stack (API + Postgres + Redis [+ Prometheus]).
#
# The project is pinned to "autobuy-platform" (top-level `name:`), so the
# containers are addressed the same way from any checkout path.
#
#   docker compose up -d                          # dev: Postgres + Redis only
#   docker compose --profile prod up -d --build   # production: + the API
#   docker compose --profile monitoring up -d     # + Prometheus on :9090

name: minas-ai-asset-buy---bitget---private

services:
  postgres:
    image: postgres:16-alpine
    container_name: autobuy_postgres
    environment:
      POSTGRES_USER: autobuy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autobuy_password}
      POSTGRES_DB: autobuy_db
    ports:
      # Loopback only — this box also holds live exchange keys; published
      # container ports bypass ufw, so never expose the datastores publicly.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autobuy"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autobuy_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Platform API (production profile):
  #   docker compose --profile prod up -d --build
  # Dev runs uvicorn on the host against the postgres/redis above, or use
  # docker-compose.dev.yml as an override for in-container reload.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}   # scripts/deploy.sh sets it to the checkout's HEAD
    image: autobuy-api:latest
    container_name: autobuy_api
    profiles: ["prod"]
    restart: always
    ports:
      # Localhost only: the web container reaches it over the compose network,
      # and caddy / tailscale serve front that for everyone else. Must stay
      # loopback-only: gunicorn trusts X-Forwarded-For from any peer (see
      # Dockerfile.api), which is safe only while nginx is the sole way in.
      - "127.0.0.1:8000:8000"
    environment:
      API_ENV: ${API_ENV:-production}
      REQUIRE_PRODUCTION: ${REQUIRE_PRODUCTION:-}
      DATABASE_URL: postgresql+asyncpg://autobuy:${POSTGRES_PASSWORD:-autobuy_password}@postgres:5432/autobuy_db
      REDIS_URL: redis://redis:6379/0
      # Empty values are rejected by the app's production boot guard (and by
      # scripts/deploy.sh before it ever starts this service); interpolation
      # stays lax so the dev stack (postgres+redis) parses without a .env.
      SECRET_KEY: ${SECRET_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SUMSUB_APP_TOKEN: ${SUMSUB_APP_TOKEN:-}
      SUMSUB_SECRET_KEY: ${SUMSUB_SECRET_KEY:-}
      SUMSUB_WEBHOOK_SECRET: ${SUMSUB_WEBHOOK_SECRET:-}
      SUMSUB_LEVEL_NAME: ${SUMSUB_LEVEL_NAME:-}
      AUTOBUY_DRY_RUN: ${AUTOBUY_DRY_RUN:-1}
      APP_BASE_URL: ${APP_BASE_URL:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      APP_NAME: ${APP_NAME:-}
      LOG_RESET_LINKS: ${LOG_RESET_LINKS:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-1}
      SUPPORTED_EXCHANGES: ${SUPPORTED_EXCHANGES:-bitget}
      BITGET_WITHDRAW_FEE_MODE: ${BITGET_WITHDRAW_FEE_MODE:-exclusive}
      EMAIL_FAILURE_ALERT_THRESHOLD: ${EMAIL_FAILURE_ALERT_THRESHOLD:-5}
      FILL_TOLERANCE_PCT: ${FILL_TOLERANCE_PCT:-10}
      FILL_WARN_PCT: ${FILL_WARN_PCT:-3}
      # Every remaining variable api/config.py reads. tests/test_env_plumbing.py fails
      # CI if the code reads a variable that is not listed here.
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ALGORITHM: ${ALGORITHM:-HS256}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-1}
      AUTOBUY_DB_POOL: ${AUTOBUY_DB_POOL:-}
      SUMSUB_API_URL: ${SUMSUB_API_URL:-https://api.sumsub.com}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      PUBLIC_SERVER_IP: ${PUBLIC_SERVER_IP:-}
      SIGNUP_INVITE_CODE: ${SIGNUP_INVITE_CODE:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_MAX_PER_MINUTE: ${TELEGRAM_MAX_PER_MINUTE:-20}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Web frontend: nginx serving the built SPA (frontend/dist — build it with
  # `cd frontend && npm ci && npm run build`, or rsync a laptop build to the
  # server) with an SPA fallback, forwarding /api/ and /health to the api
  # container. Published on localhost only; the `caddy` service below fronts
  # it with public HTTPS and `tailscale serve` with the private tailnet URL.
  web:
    image: nginx:1.27-alpine
    container_name: autobuy_web
    profiles: ["prod"]
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deployment/nginx.web.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Public HTTPS: Caddy terminates TLS for PUBLIC_HOSTNAME (automatic Let's
  # Encrypt certificate, http -> https redirect) and hands every request to
  # `web`. The only service published on a public interface; the certificate
  # and ACME account live in the caddy_data volume — keep it across deploys,
  # Let's Encrypt rate-limits re-issuance.
  caddy:
    image: caddy:2.10-alpine
    container_name: autobuy_caddy
    profiles: ["prod"]
    restart: always
    ports:
      # PUBLIC_BIND_IP: the host address to listen on. Set it (in .env) to the
      # box's VPC address when something else already holds :443 on another
      # interface — on the Tokyo box tailscaled serves the tailnet URL on
      # 100.x:443, so binding 0.0.0.0 fails with "address already in use".
      - "${PUBLIC_BIND_IP:-0.0.0.0}:80:80"
      - "${PUBLIC_BIND_IP:-0.0.0.0}:443:443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-autobuy.minastrade.com}
    volumes:
      - ./deployment/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional metrics scraper:  docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:latest
    container_name: autobuy_prometheus
    profiles: ["monitoring"]
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  caddy_data:
  caddy_config:
